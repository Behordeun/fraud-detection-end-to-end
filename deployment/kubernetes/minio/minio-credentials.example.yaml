# MinIO credentials for the fraud-detection namespace.
#
# This is a TEMPLATE. Do not commit real credentials. Create the real Secret
# out of band, for example:
#
#   kubectl -n fraud-detection create secret generic minio-credentials \
#     --from-literal=access-key="$MINIO_ACCESS_KEY" \
#     --from-literal=secret-key="$MINIO_SECRET_KEY"
#
# Applying this file as-is creates a Secret with placeholder values so a fresh
# cluster resolves the deployment's secretKeyRef; replace it with the command
# above before any real use.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: fraud-detection
type: Opaque
stringData:
  access-key: CHANGE_ME
  secret-key: CHANGE_ME
