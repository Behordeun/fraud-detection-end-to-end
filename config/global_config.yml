data:
  raw_path: "data/raw"
  processed_path: "data/processed"
  dvc_remote: "s3://mybucket"

airflow:
  executor: "LocalExecutor"
  dags_folder: "/opt/airflow/dags"

services:
  minio:
    url: "${MINIO_ENDPOINT:-http://localhost:9000}"
    access_key: "${MINIO_ACCESS_KEY}"
    secret_key: "${MINIO_SECRET_KEY}"
